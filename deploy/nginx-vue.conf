# Vue 서버(Public)의 /etc/nginx/conf.d/vue.conf 로 저장.
# LB가 `/api/*`는 API 서버로 보내므로 여기서는 정적 파일만 서빙한다.
# Vue 빌드 결과(dist)는 /var/www/vue 에 둔다. (Actions가 올려줌)
server {
    listen 80;
    server_name _;

    root /var/www/vue;
    index index.html;

    # SPA 새로고침 시 404 방지
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 캐시 (해시가 붙은 js/css)
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # LB 헬스체크용
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
